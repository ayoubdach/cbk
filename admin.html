<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — La Sélection CBK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --terracotta:#C0392B;
    --terracotta-dark:#8F2A1E;
    --terracotta-light:#E8735F;
    --cream:#F5CBA7;
    --cream-light:#FBF3EA;
    --sand:#F1E4CF;
    --blue:#1A5276;
    --blue-dark:#0E2F42;
    --blue-mid:#215D82;
    --gold:#D4AC0D;
    --gold-light:#F0CB4D;
    --ink:#241B12;
    --paper:#FFFDFA;
    --line:rgba(36,27,18,.12);
    --shadow-sm:0 6px 18px rgba(36,27,18,.08);
    --shadow:0 18px 44px rgba(36,27,18,.14);
  }
  
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    background:var(--cream-light);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1,h2,h3,h4{font-family:'Cairo',sans-serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  
  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 260px;
    background: var(--blue-dark);
    color: #DCCBAE;
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    z-index: 100;
  }
  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(145deg,var(--terracotta),var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(192,57,43,.35);
  }
  .brand-mark span{font-family:'Cairo',sans-serif;font-weight:900;color:#fff;font-size:16px;}
  .sidebar-header h2 { font-size: 18px; font-weight: 700; color: #fff; line-height: 1.2;}
  
  .sidebar-nav { padding: 24px 0; flex: 1; }
  .sidebar-nav li a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .sidebar-nav li a:hover, .sidebar-nav li a.active {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-left: 4px solid var(--gold);
  }
  .sidebar-nav li a i { width: 20px; text-align: center; color: var(--gold-light); }

  /* ============ MAIN CONTENT ============ */
  .main-content {
    flex: 1;
    margin-left: 260px;
    padding: 40px;
    background: var(--paper);
    min-height: 100vh;
  }
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
  }
  .top-header h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--blue-dark);
  }
  .admin-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .admin-avatar {
    width: 40px; height: 40px;
    background: var(--terracotta);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ============ DASHBOARD GRID ============ */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 30px;
  }

  /* ============ ADD PRODUCT FORM ============ */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--blue-dark);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title i { color: var(--terracotta); }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s;
    background: var(--cream-light);
  }
  .form-control:focus {
    outline: none;
    border-color: var(--terracotta);
    background: #fff;
  }
  
  .btn-submit {
    width: 100%;
    background: var(--blue);
    color: #fff;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .btn-submit:hover { background: var(--blue-dark); }

  /* ============ INVENTORY TABLE ============ */
  .table-responsive {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  th {
    font-size: 13px;
    font-weight: 600;
    color: #8b7c6d;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .prod-cell {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .prod-cell img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--cream-light);
  }
  .prod-info strong { display: block; color: var(--blue-dark); margin-bottom: 2px;}
  .prod-info span { font-size: 12px; color: #8b7c6d; }
  
  .status {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .status.in-stock { background: #E8F8F5; color: #117A65; }
  .status.out-stock { background: #FDEDEC; color: #C0392B; }

  .action-btn {
    color: var(--terracotta);
    background: rgba(192,57,43,0.1);
    width: 32px; height: 32px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .action-btn:hover {
    background: var(--terracotta);
    color: #fff;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .sidebar { width: 80px; }
    .sidebar-header h2, .sidebar-nav li a span { display: none; }
    .sidebar-nav li a { justify-content: center; padding: 16px; }
    .sidebar-nav li a i { font-size: 20px; }
    .main-content { margin-left: 80px; padding: 20px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand-mark"><span>CBK</span></div>
    <h2>CBK Admin</h2>
  </div>
  <ul class="sidebar-nav">
    <li><a href="#" class="active"><i class="fa-solid fa-boxes-stacked"></i> <span>Produits & Stock</span></a></li>
    <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> <span>Commandes</span></a></li>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i> <span>Statistiques</span></a></li>
    <li><a href="#"><i class="fa-solid fa-gear"></i> <span>Paramètres</span></a></li>
  </ul>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
  <div class="top-header">
    <h1>Gestion des Produits</h1>
    <div class="admin-profile">
      <span>Administrateur</span>
      <div class="admin-avatar"><i class="fa-solid fa-user"></i></div>
    </div>
  </div>

  <div class="dashboard-grid">
    
    <!-- ADD PRODUCT FORM -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-circle-plus"></i> Ajouter un produit
      </div>
      <form id="addProductForm">
        <div class="form-group">
          <label>Nom du Produit</label>
          <input type="text" id="prodName" class="form-control" placeholder="ex: Vasque à Poser Ronde..." required>
        </div>
        
        <div class="form-group">
          <label>Catégorie</label>
          <select id="prodCat" class="form-control">
            <option value="Faïence">Faïence</option>
            <option value="Grés">Grés</option>
            <option value="Sanitaire">Sanitaire</option>
            <option value="Baignoire">Baignoire</option>
            <option value="Robinetterie">Robinetterie</option>
            <option value="Meubles">Meubles</option>
            <option value="Accessoires">Accessoires</option>
          </select>
        </div>

        <div class="form-group">
          <label>Prix (TND)</label>
          <input type="number" step="0.01" id="prodPrice" class="form-control" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label>URL de la Photo</label>
          <input type="url" id="prodImg" class="form-control" placeholder="https://lien-de-l-image.jpg" required>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-check"></i> Enregistrer le produit
        </button>
      </form>
    </div>

    <!-- INVENTORY TABLE -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-list"></i> Inventaire actuel
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Produit</th>
              <th>Catégorie</th>
              <th>Prix</th>
              <th>Stock</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="inventoryList">
            <!-- Products will be injected here via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
/* ============================================================
   MOCK DATA (Matching the main site)
   ============================================================ */
let adminProducts = [
  { id:1, name:"Carreau Faïence Méditerranée 30x30", cat:"Faïence", price:12.50, stock:45, img:"https://images.unsplash.com/photo-1523413363574-c30aa1c2a516?auto=format&fit=crop&w=150&q=80" },
  { id:6, name:"Grés Cérame Marbre Gris 60x60", cat:"Grés", price:28.00, stock:0, img:"https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&w=150&q=80" },
  { id:11, name:"Lavabo Suspendu Élégance Blanc", cat:"Sanitaire", price:89.00, stock:12, img:"https://images.unsplash.com/photo-1584622781831-2917730e0108?auto=format&fit=crop&w=150&q=80" }
];

/* ============================================================
   RENDER TABLE
   ============================================================ */
function renderInventory() {
  const tbody = document.getElementById("inventoryList");
  tbody.innerHTML = adminProducts.map(p => `
    <tr>
      <td>
        <div class="prod-cell">
          <img src="${p.img}" alt="${p.name}">
          <div class="prod-info">
            <strong>${p.name}</strong>
            <span>ID: #00${p.id}</span>
          </div>
        </div>
      </td>
      <td>${p.cat}</td>
      <td><strong>${p.price.toFixed(2)} TND</strong></td>
      <td>
        <span class="status ${p.stock > 0 ? 'in-stock' : 'out-stock'}">
          ${p.stock > 0 ? p.stock + ' en stock' : 'Rupture'}
        </span>
      </td>
      <td>
        <button class="action-btn" onclick="deleteProduct(${p.id})" title="Supprimer">
          <i class="fa-solid fa-trash"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

/* ============================================================
   ADD PRODUCT LOGIC
   ============================================================ */
document.getElementById("addProductForm").addEventListener("submit", function(e) {
  e.preventDefault();
  
  const name = document.getElementById("prodName").value;
  const cat = document.getElementById("prodCat").value;
  const price = parseFloat(document.getElementById("prodPrice").value);
  const img = document.getElementById("prodImg").value;
  
  const newProduct = {
    id: Date.now(), // Generate a unique ID
    name: name,
    cat: cat,
    price: price,
    stock: 10, // Default stock for newly added items
    img: img
  };
  
  // Add to array and re-render
  adminProducts.unshift(newProduct);
  renderInventory();
  
  // Reset form
  this.reset();
});

/* ============================================================
   DELETE PRODUCT
   ============================================================ */
function deleteProduct(id) {
  if(confirm("Êtes-vous sûr de vouloir supprimer ce produit ?")) {
    adminProducts = adminProducts.filter(p => p.id !== id);
    renderInventory();
  }
}

// Initial render
renderInventory();
</script>
</body>
</html>
